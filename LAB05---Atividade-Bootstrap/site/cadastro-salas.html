<html lang="pt-br"><head>

<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CinemaWeb</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#0f1117; color:#e6e6e6; }
  .card { background:#151a22; border:1px solid #242b36; }
  .form-control, .form-select { background:#0f141b; color:#e6e6e6; border-color:#2a3342; }
  .form-control:focus, .form-select:focus { box-shadow:none; border-color:#0d6efd; }
  a { text-decoration:none; }
  .table { color:#e6e6e6; }
  .table thead { background:#0d6efd22; }
</style>

</head><body>

<!-- Navbar comum -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">CinemaWeb</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="cadastro-filmes.html">Filmes</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-salas.html">Salas</a></li>
        <li class="nav-item"><a class="nav-link" href="cadastro-sessoes.html">Sessões</a></li>
        <li class="nav-item"><a class="nav-link" href="sessoes.html">Listar Sessões</a></li>
        <li class="nav-item"><a class="nav-link" href="venda-ingressos.html">Vender Ingresso</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-4">
  <h2 class="mb-3">Cadastro de Salas</h2>
  <div class="card p-4">
    <form id="formSala" class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Nome da Sala</label>
        <input type="text" class="form-control" id="nomeSala" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Capacidade</label>
        <input type="number" class="form-control" id="capacidade" min="1" required>
      </div>
      <div class="col-md-3">
        <label class="form-label">Tipo</label>
        <select class="form-select" id="tipo" required>
          <option value="" selected disabled>Escolha...</option>
          <option>2D</option><option>3D</option><option>IMAX</option>
        </select>
      </div>
      <div class="col-12 d-flex gap-2">
        <button class="btn btn-success" type="submit">Salvar Sala</button>
        <a class="btn btn-outline-secondary" href="index.html">Voltar</a>
      </div>
    </form>
  </div>
  <div class="mt-4">
    <h5>Salas cadastradas</h5>
    <table class="table table-striped table-sm" id="tabelaSalas">
      <thead><tr><th>Nome</th><th>Capacidade</th><th>Tipo</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/app.js"></script>

<script>pageInit('cadastro-salas');</script>
</body></html>
